name: Deploy to AWS Elastic Beanstalk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      EB_APPLICATION_NAME: ${{ secrets.EB_APPLICATION_NAME }}
      EB_ENVIRONMENT_NAME: ${{ secrets.EB_ENVIRONMENT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build -t $ECR_REPOSITORY:backend-${{ github.sha }} ./backend
          docker tag $ECR_REPOSITORY:backend-${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:backend-${{ github.sha }}

      - name: Push backend image to ECR
        run: docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:backend-${{ github.sha }}

      - name: Prepare Beanstalk source bundle
        run: |
          zip -r beanstalk-source.zip backend docker-compose.yml .platform || true

      - name: Upload and deploy to Elastic Beanstalk
        run: |
          VERSION_LABEL=library-sprint0-${{ github.sha }}
          aws s3 cp beanstalk-source.zip s3://${{ secrets.EB_SOURCE_BUCKET }}/beanstalk-source-$VERSION_LABEL.zip
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="${{ secrets.EB_SOURCE_BUCKET }}",S3Key="beanstalk-source-$VERSION_LABEL.zip"
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"
