# Elastic Beanstalk enhanced health format. This file is copied into
# /etc/nginx/conf.d/default.conf, which is included inside Nginx's http block.
log_format healthd
    '$msec"$uri"$status"$request_time"'
    '$upstream_response_time"$http_x_forwarded_for';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container stdout/stderr is streamed by Elastic Beanstalk to CloudWatch.
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # healthd reads hourly files from the host-mounted /var/log/nginx/healthd.
    if ($time_iso8601 ~ "^(\\d{4})-(\\d{2})-(\\d{2})T(\\d{2})") {
        set $year $1;
        set $month $2;
        set $day $3;
        set $hour $4;
    }
    access_log /var/log/nginx/healthd/application.log.$year-$month-$day-$hour healthd;

    # Public backend health endpoint for Elastic Beanstalk checks/debugging.
    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Browser calls /api/... on the same Elastic Beanstalk domain.
    # The trailing slash strips /api before forwarding to Flask.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
